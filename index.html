<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Melody Planet - DJ Mister + | 10 Tracce</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Inter:wght@300;400;600&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
body{background:#05070f;color:#fff;font-family:'Inter',sans-serif;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.planet-bg{position:fixed;inset:0;background:radial-gradient(ellipse at 50% -20%, #1a2a5a 0%, #0a0f24 40%, #05070f 100%);z-index:-2}
.container{max-width:1100px;width:100%;display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
@media(max-width:900px){.container{grid-template-columns:1fr}}
.vinyl{width:100%;aspect-ratio:1;background:radial-gradient(circle at 30% 30%, #2a3a7a, #0a0f24 60%);border-radius:50%;display:flex;justify-content:center;align-items:center;animation:spin 12s linear infinite;animation-play-state:paused;box-shadow:0 0 80px rgba(100,140,255,.3)}
.vinyl.playing{animation-play-state:running}
@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
.vinyl-label{width:42%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle, #ffdf8a 0%, #ff9a3c 30%, #c94a1a 60%, #1a0a00 100%);display:flex;flex-direction:column;justify-content:center;align-items:center;border:4px solid #111}
.vinyl-label b{font-family:'Orbitron';font-size:11px;letter-spacing:2px;color:#000}
.cover-wrap{position:relative;perspective:1200px}
.cover-img{position:absolute;top:50%;left:50%;width:88%;aspect-ratio:1;transform:translate(-50%,-50%);border-radius:12px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8);transition:all .8s;backface-visibility:hidden}
.cover-img img{width:100%;height:100%;object-fit:cover}
.cover-wrap.flipped .cover-img.front{transform:translate(-50%,-50%) rotateY(180deg);opacity:0}
.cover-wrap .cover-img.back{transform:translate(-50%,-50%) rotateY(-180deg);opacity:0}
.cover-wrap.flipped .cover-img.back{transform:translate(-50%,-50%) rotateY(0deg);opacity:1}
.flip-btn{margin:18px auto 0;display:block;background:transparent;border:1px solid rgba(255,255,255,.2);color:#8ab4ff;padding:8px 18px;border-radius:20px;font-size:12px;cursor:pointer}
.player-card{background:rgba(255,255,255,.04);backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,.08);border-radius:24px;padding:28px}
.title{font-family:'Orbitron';font-size:22px;letter-spacing:2px}
.subtitle{font-size:13px;opacity:.6;margin-bottom:24px}
.track-name{font-size:20px;font-weight:600;margin-bottom:20px;min-height:28px}
.controls{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.btn{width:48px;height:48px;border-radius:50%;border:none;cursor:pointer}
.btn-play{background:#fff;color:#000;width:58px;height:58px;font-size:22px}
.btn-side{background:rgba(255,255,255,.08);color:#fff;border:1px solid rgba(255,255,255,.12)}
.progress-wrap{background:rgba(255,255,255,.08);height:6px;border-radius:10px;overflow:hidden;cursor:pointer;margin-bottom:8px}
.progress{height:100%;background:linear-gradient(90deg,#8ab4ff,#b78cff);width:0%}
.time{display:flex;justify-content:space-between;font-size:11px;opacity:.5;margin-bottom:26px}
.track{padding:12px 14px;border-radius:12px;display:flex;gap:12px;cursor:pointer}
.track.active{background:rgba(138,180,255,.12)}
.track-num{font-family:'Orbitron';font-size:11px;opacity:.4;width:22px}
</style>
</head>
<body>
<div class="planet-bg"></div>
<div class="container">
<div class="cover-wrap" id="coverWrap">
<div class="vinyl" id="vinyl"><div class="vinyl-label"><b>MELODY<br>PLANET</b><span>DJ MISTER +</span></div></div>
<div class="cover-img front"><img src="fronte.jpg"></div>
<div class="cover-img back"><img src="retro.jpg"></div>
<button class="flip-btn" onclick="document.getElementById('coverWrap').classList.toggle('flipped')">↻ FLIP FRONTE / RETRO</button>
</div>
<div class="player-card">
<div class="title">MELODY PLANET</div>
<div class="subtitle">Compilation by DJ Mister + - 10 Tracce</div>
<div class="track-name" id="trackName">Seleziona una traccia</div>
<div class="controls">
<button class="btn btn-side" onclick="prev()">⏮</button>
<button class="btn btn-play" id="playBtn" onclick="toggle()">▶</button>
<button class="btn btn-side" onclick="next()">⏭</button>
</div>
<div class="progress-wrap" onclick="seek(event)"><div class="progress" id="progress"></div></div>
<div class="time"><span id="cur">0:00</span><span id="dur">0:00</span></div>
<div class="tracklist" id="list"></div>
</div>
</div>
<audio id="audio" preload="metadata"></audio>
<script>
const tracks = [
{f:"01 - Virtual Melody.mp3", t:"Virtual Melody"},
{f:"02 - Planet One.mp3", t:"Planet One"},
{f:"03 - Theory.mp3", t:"Theory"},
{f:"04 - west.mp3", t:"West"},
{f:"05 - Universe.mp3", t:"Universe"},
{f:"06 - Atlantide.mp3", t:"Atlantide"},
{f:"07 - MAXIMUS.mp3", t:"MAXIMUS"},
{f:"08 - Destination.mp3", t:"Destination"},
{f:"09 - Orbital.mp3", t:"Orbital"},
{f:"10 - Sonic Gravity.mp3", t:"Sonic Gravity"},
];
let idx=0;const audio=document.getElementById('audio');const nameEl=document.getElementById('trackName');const progress=document.getElementById('progress');const playBtn=document.getElementById('playBtn');const vinyl=document.getElementById('vinyl');const cur=document.getElementById('cur');const dur=document.getElementById('dur');const list=document.getElementById('list');
function render(){list.innerHTML=tracks.map((tr,i)=>`<div class="track ${i===idx?'active':''}" onclick="playAt(${i})"><div class="track-num">${String(i+1).padStart(2,'0')}</div><div><b>${tr.t}</b><br><i style="font-size:11px;opacity:.5">${tr.f}</i></div></div>`).join('');}
function playAt(i){idx=i;audio.src=encodeURI(tracks[i].f);nameEl.textContent=tracks[i].t;render();audio.play();}
function toggle(){if(!audio.src)return playAt(idx);if(audio.paused)audio.play();else audio.pause();}
function next(){playAt((idx+1)%tracks.length)}function prev(){playAt((idx-1+tracks.length)%tracks.length)}
function seek(e){const rect=e.currentTarget.getBoundingClientRect();const pct=(e.clientX-rect.left)/rect.width;audio.currentTime=pct*audio.duration;}
function fmt(s){if(isNaN(s))return"0:00";const m=Math.floor(s/60);const sec=Math.floor(s%60).toString().padStart(2,'0');return `${m}:${sec}`}
audio.addEventListener('play',()=>{playBtn.textContent='⏸';vinyl.classList.add('playing')});
audio.addEventListener('pause',()=>{playBtn.textContent='▶';vinyl.classList.remove('playing')});
audio.addEventListener('timeupdate',()=>{progress.style.width=(audio.currentTime/audio.duration*100||0)+'%';cur.textContent=fmt(audio.currentTime)});
audio.addEventListener('loadedmetadata',()=>{dur.textContent=fmt(audio.duration)});
audio.addEventListener('ended',next);
render();
</script>
</body>
</html>
